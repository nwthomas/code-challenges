[project]
name = "code-challenges"
version = "0.0.0-alpha"
description = "A repository for housing code challenges"
authors = [
    {name = "Nathan Thomas"}
]
license = {text = "GPL-3.0"}
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "sortedcontainers==2.4.0",
]

[dependency-groups]
dev = [
    "pylint==3.3.1",
]

[tool.pylint."messages control"]
disable = [
    "C0103",
    "C0114",
    "C0115",
    "C0116",
    "C0301",
    "C0303",
    "C0321",
    "C0413",
    "C2801",
    "W0104",
    "W0106",
    "W0107",
    "W0212",
    "W0621",
    "W0702",
]